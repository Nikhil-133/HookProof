[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hookproof"
version = "0.1.0"
description = "Webhook security testing tool with EffectProof state verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nikhil Kumar" }]
keywords = ["webhook", "security", "testing", "idempotency", "effectproof"]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
hookproof = "hookproof.cli:main"

[project.urls]
Homepage = "https://github.com/Nikhil-133/HookProof"
Repository = "https://github.com/Nikhil-133/HookProof"
Issues = "https://github.com/Nikhil-133/HookProof/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["hookproof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer's API is built on Option/Argument calls in default values.
"src/hookproof/cli.py" = ["B008"]
# The HTML report embeds a self-contained document (long CSS/HTML lines).
"src/hookproof/html_report.py" = ["E501"]
